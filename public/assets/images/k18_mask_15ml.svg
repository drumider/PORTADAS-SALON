<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2b2730"/>
      <stop offset="100%" stop-color="#121015"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="140" ry="25" fill="#000000" opacity="0.6"/>
  <!-- K18 Box Shape -->
  <rect x="170" y="120" width="260" height="370" rx="12" fill="url(#box)" stroke="#e0e0e0" stroke-width="1.5"/>
  <!-- K18 Pink Accent Stripe -->
  <rect x="170" y="120" width="260" height="12" rx="6" fill="#ff4d8d"/>
  <!-- K18 Big Typography -->
  <text x="200" y="200" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="64" fill="#000000" letter-spacing="-2">K18</text>
  <text x="200" y="232" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#ff4d8d" letter-spacing="1">BIOMIMETIC</text>
  <text x="200" y="248" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#ff4d8d" letter-spacing="1">HAIRSCIENCE</text>
  <line x1="200" y1="270" x2="400" y2="270" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Molecular description -->
  <text x="200" y="310" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#000000">leave-in</text>
  <text x="200" y="332" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#000000">molecular</text>
  <text x="200" y="354" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#000000">repair hair mask</text>
  <text x="200" y="380" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="11" fill="#666666">masque capillaire de réparation</text>
  <text x="200" y="395" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="11" fill="#666666">moléculaire sans rinçage</text>
  <rect x="200" y="420" width="200" height="36" rx="6" fill="#000000"/>
  <text x="300" y="443" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">15 ml / 0.5 fl oz</text>
