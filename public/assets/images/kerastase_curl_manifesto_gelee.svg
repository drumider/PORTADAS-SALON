<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2722"/>
      <stop offset="100%" stop-color="#12100d"/>
    </radialGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f2dfc9"/>
      <stop offset="35%" stop-color="#faeee1"/>
      <stop offset="65%" stop-color="#ebd5bb"/>
      <stop offset="100%" stop-color="#d9be9e"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b0b0b0"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0e0e0"/>
      <stop offset="75%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#999999"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="530" rx="110" ry="20" fill="#000000" opacity="0.6"/>
  <!-- Bottle Base -->
  <rect x="235" y="160" width="130" height="350" rx="18" fill="url(#bottle)"/>
  <!-- Silver Pump Cap -->
  <rect x="260" y="90" width="80" height="70" rx="4" fill="url(#chrome)" stroke="#777777" stroke-width="1"/>
  <!-- Kerastase Branding -->
  <text x="300" y="220" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#111111" text-anchor="middle" letter-spacing="1">KÉRASTASE</text>
  <text x="300" y="235" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="8" fill="#111111" text-anchor="middle" letter-spacing="2">PARIS</text>
  <!-- K Logo with bar -->
  <line x1="240" y1="265" x2="360" y2="265" stroke="#a38363" stroke-width="6"/>
  <path d="M285 250 L285 280 M285 265 L315 250 M285 265 L315 280" stroke="#ffffff" stroke-width="10" stroke-linecap="square"/>
  <text x="300" y="300" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#222222" text-anchor="middle" letter-spacing="2">CURL MANIFESTO</text>
  <text x="300" y="330" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10" fill="#111111" text-anchor="middle">GELÉE CURL CONTOUR</text>
  <text x="300" y="345" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7" fill="#8c6d4d" text-anchor="middle">MIEL DE MANUKA + CÉRAMIDE</text>
  <text x="300" y="365" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#444444" text-anchor="middle">Gel-crème définition boucles</text>
  <text x="300" y="376" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#444444" text-anchor="middle">Curl enhancing defining gel-cream</text>
  <text x="300" y="420" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="7.5" fill="#222222" text-anchor="middle">SANS RINÇAGE - LEAVE-IN</text>
  <text x="300" y="460" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#666666" text-anchor="middle">150 ml 5.07 fl.oz.</text>
</svg>
