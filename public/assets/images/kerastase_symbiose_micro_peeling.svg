<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2b2d35"/>
      <stop offset="100%" stop-color="#0f1015"/>
    </radialGradient>
    <linearGradient id="silver_tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cfd5e0"/>
      <stop offset="40%" stop-color="#f5f7fa"/>
      <stop offset="70%" stop-color="#d3d9e2"/>
      <stop offset="100%" stop-color="#adbac7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="520" rx="80" ry="16" fill="#000000" opacity="0.6"/>
  <!-- Tube -->
  <path d="M 220 120 L 380 120 L 360 450 C 360 470, 240 470, 240 450 Z" fill="url(#silver_tube)"/>
  <!-- White Cap -->
  <rect x="240" y="450" width="120" height="50" rx="6" fill="#f0f0f0" stroke="#cccccc"/>
  <text x="300" y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#111111" text-anchor="middle" letter-spacing="1">KÉRASTASE</text>
  <text x="300" y="172" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7" fill="#222222" text-anchor="middle" letter-spacing="2">PARIS</text>
  <!-- Teal K -->
  <path d="M 285 190 L 285 230 M 285 210 L 315 190 M 285 210 L 315 230" stroke="#2ac1bc" stroke-width="8" stroke-linecap="square"/>
  <text x="300" y="260" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" fill="#2ac1bc" text-anchor="middle" letter-spacing="2">SYMBIOSE</text>
  <text x="300" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#111111" text-anchor="middle">MICRO-PEELING CELLULAIRE</text>
  <text x="300" y="310" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="6.5" fill="#333333" text-anchor="middle">ACIDE SALICYLIQUE 1,9%</text>
  <text x="300" y="335" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#444444" text-anchor="middle">Soin micro-exfoliant cellulaire</text>
  <text x="300" y="347" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#444444" text-anchor="middle">Micro-exfoliating cellular treatment</text>
  <text x="300" y="420" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#555555" text-anchor="middle">200 ml 6.8 fl.oz.</text>
</svg>
