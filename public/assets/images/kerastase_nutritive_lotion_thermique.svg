    <linearGradient id="orange_bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e65c00"/>
      <stop offset="40%" stop-color="#ff8833"/>
      <stop offset="70%" stop-color="#f27011"/>
      <stop offset="100%" stop-color="#cc4400"/>
