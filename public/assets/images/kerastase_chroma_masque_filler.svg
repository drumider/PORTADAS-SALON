<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#302025"/>
      <stop offset="100%" stop-color="#12080a"/>
    </radialGradient>
    <linearGradient id="jar_pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e89ca9"/>
      <stop offset="50%" stop-color="#cf7283"/>
      <stop offset="100%" stop-color="#a64b5c"/>
    </linearGradient>
    <linearGradient id="silver_cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d9d9d9"/>
      <stop offset="30%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#8c8c8c"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="490" rx="140" ry="25" fill="#000000" opacity="0.6"/>
  <!-- Silver Top Lid -->
  <rect x="180" y="200" width="240" height="60" rx="12" fill="url(#silver_cap)"/>
  <ellipse cx="300" cy="200" rx="120" ry="12" fill="#ffffff" opacity="0.8"/>
  <!-- Pink Jar Body -->
  <path d="M 180 255 L 195 470 C 195 480, 405 480, 405 470 L 420 255 Z" fill="url(#jar_pink)"/>
  <!-- Front Silver K -->
  <path d="M 285 280 L 285 320 M 285 300 L 315 280 M 285 300 L 315 320" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <!-- Text Label -->
  <text x="300" y="348" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">KÉRASTASE</text>
  <text x="300" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7" fill="#ffffff" text-anchor="middle" letter-spacing="2">PARIS</text>
  <text x="300" y="380" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">CHROMA ABSOLU</text>
  <text x="300" y="398" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">MASQUE CHROMA FILLER</text>
  <text x="300" y="412" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#f0d0d8" text-anchor="middle">AMINO ACID + CENTELLA ASIATICA</text>
  <text x="300" y="455" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#f5e0e6" text-anchor="middle">200 ml 6.8 fl.oz.</text>
</svg>
