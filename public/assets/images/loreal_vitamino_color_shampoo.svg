<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2024"/>
      <stop offset="100%" stop-color="#120c0e"/>
    </radialGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5c2ce"/>
      <stop offset="35%" stop-color="#fae1e7"/>
      <stop offset="65%" stop-color="#f2b6c4"/>
      <stop offset="100%" stop-color="#d999a8"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="530" rx="130" ry="22" fill="#000000" opacity="0.6"/>
  <!-- Bottle Shape -->
  <path d="M220 200 Q220 160 260 145 L260 110 L340 110 L340 145 Q380 160 380 200 L380 490 Q380 515 350 520 L250 520 Q220 515 220 490 Z" fill="url(#bottle)"/>
  <rect x="265" y="70" width="70" height="42" rx="4" fill="url(#cap)" stroke="#444444" stroke-width="1"/>
  <!-- Label -->
  <rect x="235" y="240" width="130" height="230" fill="#ffffff" rx="2"/>
  <!-- L'oreal logo header -->
  <text x="300" y="270" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="14" fill="#111111" text-anchor="middle">L'ORÉAL</text>
  <text x="300" y="282" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="8" fill="#111111" text-anchor="middle" letter-spacing="1">PROFESSIONNEL</text>
  <text x="300" y="292" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#666666" text-anchor="middle">PARIS</text>
  <!-- Product Title -->
  <text x="300" y="330" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22" fill="#111111" text-anchor="middle">Vitamino</text>
  <text x="300" y="352" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22" fill="#111111" text-anchor="middle">Color</text>
  <text x="300" y="375" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="8" fill="#666666" text-anchor="middle" letter-spacing="1">RESVERATROL</text>
  <text x="300" y="395" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="7" fill="#111111" text-anchor="middle">PROFESSIONAL SHAMPOO</text>
  <text x="300" y="440" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10" fill="#111111" text-anchor="middle" letter-spacing="1">SERIE EXPERT</text>
  <text x="300" y="455" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#666666" text-anchor="middle">300 ml 10.1 FL.OZ</text>
</svg>
