<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a241b"/>
      <stop offset="100%" stop-color="#120e08"/>
    </radialGradient>
    <linearGradient id="gold_box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="30%" stop-color="#f9f1b5"/>
      <stop offset="60%" stop-color="#e6c65a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="500" rx="190" ry="32" fill="#000000" opacity="0.6"/>
  <!-- Box Body -->
  <rect x="140" y="180" width="320" height="290" rx="12" fill="url(#gold_box)" stroke="#ffe17d" stroke-width="1.5"/>
  <text x="300" y="230" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="26" fill="#111111" text-anchor="middle" letter-spacing="1">KÉRASTASE</text>
  <text x="300" y="248" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10" fill="#111111" text-anchor="middle" letter-spacing="2">PARIS</text>
  <!-- K Logo -->
  <path d="M280 270 L280 320 M280 295 L320 270 M280 295 L320 320" stroke="#ffffff" stroke-width="12" stroke-linecap="square"/>
  <text x="300" y="350" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="16" fill="#111111" text-anchor="middle" letter-spacing="3">ELIXIR ULTIME</text>
  <text x="300" y="375" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#111111" text-anchor="middle">LE MASQUE</text>
  <text x="300" y="392" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="8" fill="#443300">HUILE SACRÉE DE MARULA</text>
  <text x="300" y="412" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#222222" text-anchor="middle">Masque à l'huile sublimatrice - Cheveux ternes</text>
  <text x="300" y="426" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#222222" text-anchor="middle">Sublimating oil infused masque - Dull hair</text>
  <text x="300" y="455" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#443300" text-anchor="middle">200 ml 6.76 fl.oz.</text>
