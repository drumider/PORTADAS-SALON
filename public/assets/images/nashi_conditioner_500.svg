  <text x="300" y="318" font-family="'Georgia', serif" font-style="italic" font-size="9" fill="#362919" text-anchor="middle">Beauty treatment for all kind of hair</text>
  <text x="300" y="352" font-family="'Georgia', serif" font-style="italic" font-size="22" fill="#362919" text-anchor="middle">conditioner</text>
