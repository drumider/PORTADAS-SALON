  <path d="M200 190 Q200 150 260 140 L260 100 L340 100 L340 140 Q400 150 400 190 L400 500 Q400 520 380 525 L220 525 Q200 520 200 500 Z" fill="url(#bottle)"/>
  <rect x="260" y="60" width="80" height="42" rx="4" fill="#15120e" stroke="#2a2218" stroke-width="2"/>
