  <!-- Bronze Bottle Body -->
  <path d="M 235 160 C 235 190, 215 220, 215 280 L 215 480 C 215 510, 385 510, 385 480 L 385 280 C 385 220, 365 190, 365 160 Z" fill="url(#bronze_bottle)"/>
