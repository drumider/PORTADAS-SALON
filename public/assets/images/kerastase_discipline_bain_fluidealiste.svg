  <text x="300" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7" fill="#ffffff" text-anchor="middle" letter-spacing="2">PARIS</text>
  <text x="300" y="285" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#fce4c8" text-anchor="middle" letter-spacing="1.5">DISCIPLINE</text>
  <text x="300" y="315" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">BAIN FLUIDEALISTE</text>
  <text x="300" y="330" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="9" fill="#ffffff" text-anchor="middle">SANS SULFATES</text>
  <text x="300" y="350" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#fce4c8" text-anchor="middle">MORPHO-KERATINE™</text>
  <text x="300" y="380" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#ffffff" text-anchor="middle">Shampooing lisse en-mouvement</text>
  <text x="300" y="392" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#ffffff" text-anchor="middle">Smooth-in-motion shampoo</text>
  <text x="300" y="465" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#ffffff" text-anchor="middle">250 ml 8.5 fl.oz.</text>
