<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#113330"/>
      <stop offset="100%" stop-color="#051412"/>
    </radialGradient>
    <linearGradient id="teal_bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#008080"/>
      <stop offset="40%" stop-color="#20b2aa"/>
      <stop offset="70%" stop-color="#008b8b"/>
      <stop offset="100%" stop-color="#004d40"/>
    </linearGradient>
    <linearGradient id="gold_cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff0aa"/>
      <stop offset="100%" stop-color="#aa8822"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="75" ry="15" fill="#000000" opacity="0.6"/>
  <!-- Gold Double Pump -->
  <rect x="270" y="80" width="60" height="40" fill="url(#gold_cap)"/>
  <rect x="260" y="120" width="80" height="30" fill="#004d40"/>
  <!-- Teal Dual Chamber Bottle -->
  <path d="M 230 150 L 370 150 L 370 460 C 370 480, 230 480, 230 460 Z" fill="url(#teal_bottle)"/>
  <line x1="300" y1="150" x2="300" y2="470" stroke="#00332c" stroke-width="3"/>
  <text x="300" y="220" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#ffffff" text-anchor="middle" letter-spacing="1">KÉRASTASE</text>
  <text x="300" y="232" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="6.5" fill="#ffffff" text-anchor="middle" letter-spacing="2">PARIS</text>
  <text x="300" y="260" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#20b2aa" text-anchor="middle" letter-spacing="1.5">RESISTANCE</text>
  <text x="300" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">SÉRUM THÉRAPISE</text>
  <text x="300" y="315" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#e0ffff" text-anchor="middle">FIBRA-KAP™ + SÈVE DE RESSUSCITATION</text>
  <text x="300" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#ffffff" text-anchor="middle">Double sérum rénovateur de fibre</text>
  <text x="300" y="352" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#ffffff" text-anchor="middle">Dual renewing serum for damaged hair</text>
  <text x="300" y="440" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#ffffff" text-anchor="middle">30 ml 1.01 fl.oz.</text>
</svg>
