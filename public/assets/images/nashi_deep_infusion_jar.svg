<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2c2720"/>
      <stop offset="100%" stop-color="#12100d"/>
    </radialGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1611"/>
      <stop offset="25%" stop-color="#4d3b28"/>
      <stop offset="50%" stop-color="#33271a"/>
      <stop offset="85%" stop-color="#140f0a"/>
      <stop offset="100%" stop-color="#0a0805"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#444444"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b09978"/>
      <stop offset="50%" stop-color="#ccb695"/>
      <stop offset="100%" stop-color="#8f7a5b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="500" rx="190" ry="35" fill="#000000" opacity="0.6"/>
  <!-- Jar Body -->
  <rect x="150" y="220" width="300" height="260" rx="16" fill="url(#jar)"/>
  <!-- Shiny Lid -->
  <rect x="140" y="180" width="320" height="70" rx="12" fill="url(#lid)" stroke="#555555" stroke-width="1.5"/>
  <ellipse cx="300" cy="180" rx="160" ry="20" fill="#333333"/>
  <text x="300" y="188" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="3" opacity="0.8">NASHI</text>
  <!-- Label on Jar -->
  <rect x="155" y="270" width="290" height="180" fill="url(#label)" rx="4"/>
  <text x="300" y="315" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22" fill="#362919" text-anchor="middle" letter-spacing="2">ARGAN</text>
  <text x="300" y="338" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18" fill="#362919" text-anchor="middle">deep infusion</text>
  <line x1="180" y1="352" x2="420" y2="352" stroke="#5c4832" stroke-width="1"/>
  <text x="300" y="370" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" fill="#362919" font-weight="600" text-anchor="middle">TRATTAMENTO DI BELLEZZA PER TUTTI I TIPI DI CAPELLI</text>
  <text x="300" y="385" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#362919" text-anchor="middle">BEAUTY TREATMENT FOR ALL KIND OF HAIR</text>
  <text x="300" y="415" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#523f29" text-anchor="middle" letter-spacing="0.5">FREE FROM PHOSPHATES, PARABENS</text>
</svg>
