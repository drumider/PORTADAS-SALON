      <stop offset="0%" stop-color="#2c1a24"/>
      <stop offset="100%" stop-color="#12080e"/>
    </radialGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9366f"/>
      <stop offset="35%" stop-color="#e35087"/>
      <stop offset="65%" stop-color="#d64078"/>
      <stop offset="100%" stop-color="#a62454"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
