  <text x="300" y="400" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10" fill="#111111" text-anchor="middle" letter-spacing="1">SERIE EXPERT</text>
  <text x="300" y="415" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#666666" text-anchor="middle">200 ml</text>
