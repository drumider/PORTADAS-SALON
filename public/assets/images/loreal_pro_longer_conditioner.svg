  <text x="300" y="225" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="13" fill="#111111" text-anchor="middle">L'ORÉAL</text>
  <text x="300" y="237" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7.5" fill="#111111" text-anchor="middle" letter-spacing="1">PROFESSIONNEL</text>
  <text x="300" y="246" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#666666" text-anchor="middle">PARIS</text>
