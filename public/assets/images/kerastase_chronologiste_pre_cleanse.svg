<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#202020"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff0aa"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <linearGradient id="black_tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="40%" stop-color="#333333"/>
      <stop offset="70%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="520" rx="80" ry="16" fill="#000000" opacity="0.8"/>
  <!-- Tube -->
  <path d="M 220 120 L 380 120 L 360 450 C 360 470, 240 470, 240 450 Z" fill="url(#black_tube)"/>
  <!-- Black Bottom Cap -->
  <rect x="240" y="450" width="120" height="50" rx="6" fill="#1a1a1a" stroke="#333333"/>
  <text x="300" y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">KÉRASTASE</text>
  <text x="300" y="172" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7" fill="#dddddd" text-anchor="middle" letter-spacing="2">PARIS</text>
  <!-- Gold K -->
  <path d="M 285 190 L 285 230 M 285 210 L 315 190 M 285 210 L 315 230" stroke="url(#gold)" stroke-width="8" stroke-linecap="square"/>
  <text x="300" y="260" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" fill="url(#gold)" text-anchor="middle" letter-spacing="2">CHRONOLOGISTE</text>
  <text x="300" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">PRÉ-CLEANSE RÉGÉNÉRANT</text>
  <text x="300" y="310" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="6.5" fill="#cccccc" text-anchor="middle">CHARCOAL + ACIDE HYALURONIQUE</text>
  <text x="300" y="335" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#aaaaaa" text-anchor="middle">Pré-shampooing revitalisant jeunesse</text>
  <text x="300" y="347" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#aaaaaa" text-anchor="middle">Youth revitalizing purifying pre-shampoo</text>
  <text x="300" y="420" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#888888" text-anchor="middle">200 ml 6.76 fl.oz.</text>
</svg>
