<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#202020"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#fff0aa"/>
      <stop offset="100%" stop-color="#aa820a"/>
    </linearGradient>
    <linearGradient id="black_bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1c1c"/>
      <stop offset="40%" stop-color="#3d3d3d"/>
      <stop offset="70%" stop-color="#222222"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="90" ry="18" fill="#000000" opacity="0.8"/>
  <!-- Gold Top Cap -->
  <path d="M 230 110 L 370 110 L 350 160 L 250 160 Z" fill="url(#gold)"/>
  <!-- Bottle Body -->
  <path d="M 250 160 C 240 230, 230 380, 250 490 L 350 490 C 370 380, 360 230, 350 160 Z" fill="url(#black_bottle)"/>
  <text x="300" y="210" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#ffffff" text-anchor="middle" letter-spacing="1">KÉRASTASE</text>
  <text x="300" y="222" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7" fill="#dddddd" text-anchor="middle" letter-spacing="2">PARIS</text>
  <!-- Gold K -->
  <path d="M 285 240 L 285 280 M 285 260 L 315 240 M 285 260 L 315 280" stroke="url(#gold)" stroke-width="8" stroke-linecap="square"/>
  <text x="300" y="310" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" fill="url(#gold)" text-anchor="middle" letter-spacing="2">CHRONOLOGISTE</text>
  <text x="300" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">BAIN RÉGÉNÉRANT</text>
  <text x="300" y="358" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="6.5" fill="#cccccc" text-anchor="middle">ABYSSINE + ACIDE HYALURONIQUE</text>
  <text x="300" y="380" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#aaaaaa" text-anchor="middle">Shampooing revitalisant jeunesse</text>
  <text x="300" y="392" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#aaaaaa" text-anchor="middle">Youth revitalizing shampoo</text>
  <text x="300" y="465" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#888888" text-anchor="middle">250 ml 8.5 fl.oz.</text>
</svg>
