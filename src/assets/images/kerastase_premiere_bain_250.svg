<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2c2c30"/>
      <stop offset="100%" stop-color="#121215"/>
    </radialGradient>
    <linearGradient id="white_bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dedee4"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#efeff5"/>
      <stop offset="100%" stop-color="#cccccc"/>
    </linearGradient>
    <linearGradient id="silver_cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cccccc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#999999"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="520" rx="90" ry="18" fill="#000000" opacity="0.6"/>
  <!-- Silver Top Cap -->
  <rect x="235" y="110" width="130" height="50" rx="6" fill="url(#silver_cap)"/>
  <!-- White Bottle Body -->
  <path d="M 235 160 C 235 190, 215 220, 215 280 L 215 480 C 215 510, 385 510, 385 480 L 385 280 C 385 220, 365 190, 365 160 Z" fill="url(#white_bottle)"/>
  <text x="300" y="250" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#111111" text-anchor="middle" letter-spacing="1">KÉRASTASE</text>
  <text x="300" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7" fill="#111111" text-anchor="middle" letter-spacing="2">PARIS</text>
  <text x="300" y="285" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#222222" text-anchor="middle" letter-spacing="1.5">PREMIÈRE</text>
  <text x="300" y="315" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#111111" text-anchor="middle">BAIN DÉCALCIFIANT</text>
  <text x="300" y="330" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#111111" text-anchor="middle">RÉPARATEUR</text>
  <text x="300" y="350" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#666666" text-anchor="middle">ACIDE CITRIQUE + GLYCINE</text>
  <text x="300" y="380" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#222222" text-anchor="middle">Shampooing décalcifiant réparateur</text>
  <text x="300" y="392" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#222222" text-anchor="middle">Decalcifying repairing shampoo</text>
  <text x="300" y="465" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#444444" text-anchor="middle">250 ml 8.5 fl.oz.</text>
