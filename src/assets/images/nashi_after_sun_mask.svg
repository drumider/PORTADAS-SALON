<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2016"/>
      <stop offset="100%" stop-color="#0f0c08"/>
    </radialGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e68d20"/>
      <stop offset="35%" stop-color="#fca835"/>
      <stop offset="65%" stop-color="#f59c22"/>
      <stop offset="100%" stop-color="#c97108"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#444444"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="530" rx="120" ry="20" fill="#000000" opacity="0.6"/>
  <!-- Tube Cap at bottom -->
  <rect x="250" y="470" width="100" height="40" rx="4" fill="url(#cap)" stroke="#555555" stroke-width="1"/>
  <!-- Tube Body -->
  <path d="M220 110 L380 110 L350 470 L250 470 Z" fill="url(#tube)"/>
  <!-- Top crimp seal -->
  <rect x="215" y="100" width="170" height="15" fill="#d47911" rx="1"/>
  <path d="M220 100 H380 M220 103 H380 M220 106 H380 M220 109 H380 M220 112 H380" stroke="#a65d07" stroke-width="1"/>
  <!-- Text on Tube -->
  <text x="300" y="180" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#2d1c08" text-anchor="middle" letter-spacing="1">nashi</text>
  <text x="300" y="202" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="18" fill="#2d1c08" text-anchor="middle" letter-spacing="4">ARGAN</text>
  <text x="300" y="228" font-family="'Georgia', serif" font-style="italic" font-size="8.5" fill="#2d1c08" text-anchor="middle">Trattamento di bellezza per tutti i tipi di capello</text>
  <text x="300" y="240" font-family="'Georgia', serif" font-style="italic" font-size="8" fill="#2d1c08" text-anchor="middle">Beauty treatment for all kind of hair</text>
  <text x="300" y="265" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="18" fill="#2d1c08" text-anchor="middle" letter-spacing="2">mask</text>
  <text x="300" y="282" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="12" fill="#2d1c08" text-anchor="middle">after sun repairing</text>
  <!-- UV FACTOR stamp circle -->
  <circle cx="300" cy="360" r="42" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.95"/>
  <path d="M260 365 C 275 340, 325 340, 340 365" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.8"/>
  <text x="300" y="365" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle" letter-spacing="1">UV FACTOR</text>
  <!-- Specular shine -->
  <path d="M225 110 L250 110 L270 470 L255 470 Z" fill="#ffffff" opacity="0.18"/>
</svg>
