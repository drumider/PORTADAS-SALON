<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2c2720"/>
      <stop offset="100%" stop-color="#12100d"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b09978"/>
      <stop offset="40%" stop-color="#ccb695"/>
      <stop offset="70%" stop-color="#bfa988"/>
      <stop offset="100%" stop-color="#8f7a5b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="530" rx="110" ry="18" fill="#000000" opacity="0.6"/>
  <!-- Tall Box -->
  <rect x="220" y="80" width="160" height="430" rx="4" fill="url(#box)" stroke="#6e5c43" stroke-width="2"/>
  <path d="M220 80 L235 70 L395 70 L380 80 Z" fill="#d9c29c"/>
  <!-- Stamps top right -->
  <rect x="330" y="95" width="22" height="18" fill="#d97262" opacity="0.8" rx="1"/>
  <rect x="354" y="95" width="22" height="18" fill="#62a3d9" opacity="0.8" rx="1"/>
  <!-- Content -->
  <text x="300" y="170" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="34" fill="#362919" text-anchor="middle" letter-spacing="2">nashi</text>
  <text x="300" y="196" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="20" fill="#362919" text-anchor="middle" letter-spacing="5">ARGAN</text>
  <text x="300" y="225" font-family="'Georgia', serif" font-style="italic" font-size="10" fill="#362919" text-anchor="middle">Trattamento di bellezza per tutti i tipi di capello</text>
  <text x="300" y="238" font-family="'Georgia', serif" font-style="italic" font-size="9" fill="#362919" text-anchor="middle">Beauty treatment for all kind of hair</text>
  <text x="300" y="280" font-family="'Georgia', serif" font-style="italic" font-size="28" fill="#362919" text-anchor="middle">oil</text>
  <!-- Seal stamp -->
  <circle cx="300" cy="380" r="45" fill="none" stroke="#2b2013" stroke-width="1.5" opacity="0.3"/>
  <text x="300" y="385" font-family="'Georgia', serif" font-style="italic" font-size="12" fill="#2b2013" text-anchor="middle" opacity="0.4" letter-spacing="1">THE ORIGINAL</text>
</svg>
