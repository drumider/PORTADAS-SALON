<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2024"/>
      <stop offset="100%" stop-color="#120c0e"/>
    </radialGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5d3dc"/>
      <stop offset="50%" stop-color="#fae8ed"/>
      <stop offset="100%" stop-color="#e8bdc9"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="500" rx="190" ry="35" fill="#000000" opacity="0.6"/>
  <!-- Jar Body -->
  <rect x="150" y="220" width="300" height="260" rx="20" fill="url(#jar)"/>
  <!-- Shiny Lid -->
  <rect x="140" y="175" width="320" height="70" rx="12" fill="url(#lid)" stroke="#444444" stroke-width="1.5"/>
  <ellipse cx="300" cy="175" rx="160" ry="20" fill="#222222"/>
  <!-- Label on Jar -->
  <rect x="180" y="270" width="240" height="180" fill="#ffffff" rx="4" opacity="0.95"/>
  <text x="200" y="315" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="28" fill="#111111">Vitamino Color</text>
  <text x="200" y="335" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10" fill="#666666" letter-spacing="1">RESVERATROL</text>
  <text x="200" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#111111">MASQUE PROFESSIONNEL / PROFESSIONAL MASK</text>
  <text x="200" y="375" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#555555">Fixateur de couleur pour cheveux colorés</text>
  <text x="200" y="388" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#555555">Color radiance system for colored hair</text>
  <text x="200" y="420" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#111111" letter-spacing="1">SERIE EXPERT</text>
  <!-- L'oreal logo right side -->
  <text x="390" y="400" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#111111" text-anchor="end">L'ORÉAL</text>
  <text x="390" y="410" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#111111" text-anchor="end">PROFESSIONNEL</text>
</svg>
