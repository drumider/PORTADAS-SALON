<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2238"/>
      <stop offset="100%" stop-color="#0f0a17"/>
    </radialGradient>
    <linearGradient id="lavender_tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8a2dc"/>
      <stop offset="40%" stop-color="#d4c5ed"/>
      <stop offset="70%" stop-color="#c1addf"/>
      <stop offset="100%" stop-color="#9375c8"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#adff2f"/>
      <stop offset="33%" stop-color="#00ffff"/>
      <stop offset="66%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#ffff00"/>
    </linearGradient>
    <linearGradient id="silver_cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#999999"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#777777"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="520" rx="80" ry="16" fill="#000000" opacity="0.6"/>
  <!-- Upside down tube -->
  <path d="M 220 120 L 380 120 L 360 450 C 360 470, 240 470, 240 450 Z" fill="url(#lavender_tube)"/>
  <!-- Silver Bottom Cap -->
  <rect x="240" y="450" width="120" height="50" rx="6" fill="url(#silver_cap)"/>
  <!-- Holographic K -->
  <path d="M 285 190 L 285 230 M 285 210 L 315 190 M 285 210 L 315 230" stroke="url(#holo)" stroke-width="8" stroke-linecap="square"/>
  <text x="300" y="160" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#111111" text-anchor="middle" letter-spacing="1">KÉRASTASE</text>
  <text x="300" y="172" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7" fill="#111111" text-anchor="middle" letter-spacing="2">PARIS</text>
  <text x="300" y="260" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" fill="#4a227b" text-anchor="middle" letter-spacing="2">BLOND ABSOLU</text>
  <text x="300" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#111111" text-anchor="middle">CICAFLASH</text>
  <text x="300" y="310" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="6.5" fill="#443366" text-anchor="middle">ACIDE HYALURONIQUE + EDELWEISS</text>
  <text x="300" y="335" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#222222" text-anchor="middle">Fondant fortifiant profond</text>
  <text x="300" y="347" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#222222" text-anchor="middle">Intense fortifying treatment</text>
  <text x="300" y="420" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#333333" text-anchor="middle">250 ml 8.45 fl.oz.</text>
</svg>
