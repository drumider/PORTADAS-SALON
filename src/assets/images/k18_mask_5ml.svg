<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2b2730"/>
      <stop offset="100%" stop-color="#121015"/>
    </radialGradient>
    <linearGradient id="box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f0f5"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="140" ry="25" fill="#000000" opacity="0.6"/>
  <!-- K18 Box Shape -->
  <rect x="180" y="140" width="240" height="340" rx="12" fill="url(#box)" stroke="#e0e0e0" stroke-width="1.5"/>
  <!-- K18 Pink Accent Stripe -->
  <rect x="180" y="140" width="240" height="12" rx="6" fill="#ff4d8d"/>
  <!-- K18 Big Typography -->
  <text x="210" y="220" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="58" fill="#000000" letter-spacing="-2">K18</text>
  <text x="210" y="250" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#ff4d8d" letter-spacing="1">BIOMIMETIC</text>
  <text x="210" y="265" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#ff4d8d" letter-spacing="1">HAIRSCIENCE</text>
  <line x1="210" y1="285" x2="390" y2="285" stroke="#e0e0e0" stroke-width="1"/>
  <!-- Molecular description -->
  <text x="210" y="320" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#000000">leave-in</text>
  <text x="210" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#000000">molecular</text>
  <text x="210" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="15" fill="#000000">repair hair mask</text>
  <text x="210" y="385" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10" fill="#666666">masque capillaire de réparation</text>
  <text x="210" y="398" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="10" fill="#666666">moléculaire sans rinçage</text>
  <rect x="210" y="420" width="180" height="32" rx="6" fill="#000000"/>
  <text x="300" y="441" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="12" fill="#ffffff" text-anchor="middle">5 ml / 0.17 fl oz</text>
</svg>
