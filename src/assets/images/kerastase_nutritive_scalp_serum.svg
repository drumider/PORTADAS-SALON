      <stop offset="0%" stop-color="#332211"/>
      <stop offset="100%" stop-color="#120b05"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff5ee"/>
      <stop offset="70%" stop-color="#ffeedd"/>
      <stop offset="100%" stop-color="#e6c2a0"/>
