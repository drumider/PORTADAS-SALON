  <text x="300" y="240" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#111111" text-anchor="middle" letter-spacing="1">KÉRASTASE</text>
  <text x="300" y="252" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7" fill="#111111" text-anchor="middle" letter-spacing="2">PARIS</text>
  <text x="300" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" fill="#ff6600" text-anchor="middle" letter-spacing="1.5">NUTRITIVE</text>
  <text x="300" y="310" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10" fill="#111111" text-anchor="middle">NUTRI-SUPPLEMENT</text>
  <text x="300" y="324" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10" fill="#111111" text-anchor="middle">SCALP SERUM</text>
  <text x="300" y="348" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#666666" text-anchor="middle">VITAMIN-IN-OIL BLEND + NIACINAMIDE</text>
  <text x="300" y="440" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#444444" text-anchor="middle">90 ml 3.04 fl.oz.</text>
