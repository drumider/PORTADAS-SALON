  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="80" ry="16" fill="#000000" opacity="0.6"/>
  <!-- Dropper Cap -->
  <rect x="270" y="80" width="60" height="40" rx="10" fill="#333333"/>
  <rect x="280" y="120" width="40" height="30" fill="#ff7700"/>
  <rect x="260" y="150" width="80" height="15" rx="3" fill="#ffffff"/>
  <!-- Glass Bottle -->
  <path d="M 230 165 C 230 190, 220 220, 220 260 L 220 460 C 220 480, 380 480, 380 460 L 380 260 C 380 220, 370 190, 370 165 Z" fill="url(#glass)" stroke="#e8a060" stroke-width="2"/>
