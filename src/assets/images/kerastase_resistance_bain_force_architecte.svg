<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1a3d2f"/>
      <stop offset="100%" stop-color="#081812"/>
    </radialGradient>
    <linearGradient id="mint_bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#76d7b7"/>
      <stop offset="40%" stop-color="#a3e4d7"/>
      <stop offset="70%" stop-color="#85e0ce"/>
      <stop offset="100%" stop-color="#52be80"/>
    </linearGradient>
    <linearGradient id="silver_cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cccccc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#999999"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="520" rx="90" ry="18" fill="#000000" opacity="0.6"/>
  <!-- Silver Top Cap -->
  <rect x="235" y="110" width="130" height="50" rx="6" fill="url(#silver_cap)"/>
  <!-- Mint Green Bottle Body -->
  <path d="M 235 160 C 235 190, 215 220, 215 280 L 215 480 C 215 510, 385 510, 385 480 L 385 280 C 385 220, 365 190, 365 160 Z" fill="url(#mint_bottle)"/>
