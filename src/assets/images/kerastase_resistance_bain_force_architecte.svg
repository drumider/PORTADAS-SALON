  <text x="300" y="262" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7" fill="#111111" text-anchor="middle" letter-spacing="2">PARIS</text>
  <text x="300" y="285" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="10" fill="#0e6251" text-anchor="middle" letter-spacing="1.5">RESISTANCE</text>
  <text x="300" y="315" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="12" fill="#111111" text-anchor="middle">BAIN FORCE ARCHITECTE</text>
  <text x="300" y="340" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#1e8449" text-anchor="middle">VITA-CIMENT® + SÈVE DE RESSUSCITATION</text>
  <text x="300" y="375" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#111111" text-anchor="middle">Shampooing reconstructeur</text>
  <text x="300" y="387" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#111111" text-anchor="middle">Reconstructing shampoo</text>
  <text x="300" y="465" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#333333" text-anchor="middle">250 ml 8.5 fl.oz.</text>
