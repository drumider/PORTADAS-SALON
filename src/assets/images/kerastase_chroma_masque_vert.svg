<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#282024"/>
      <stop offset="100%" stop-color="#100b0e"/>
    </radialGradient>
    <linearGradient id="pink_box" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5d0d6"/>
      <stop offset="50%" stop-color="#ebb2bc"/>
      <stop offset="100%" stop-color="#d998a4"/>
    </linearGradient>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#adff2f"/>
      <stop offset="33%" stop-color="#00ffff"/>
      <stop offset="66%" stop-color="#ff00ff"/>
      <stop offset="100%" stop-color="#ffff00"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="110" ry="22" fill="#000000" opacity="0.6"/>
  <!-- Tall Box Body -->
  <rect x="200" y="80" width="200" height="420" rx="8" fill="url(#pink_box)" stroke="#d998a4" stroke-width="1.5"/>
  <text x="300" y="130" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="22" fill="#111111" text-anchor="middle" letter-spacing="1">KÉRASTASE</text>
  <text x="300" y="145" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="9" fill="#111111" text-anchor="middle" letter-spacing="2">PARIS</text>
  <!-- Holographic K Logo -->
  <line x1="220" y1="195" x2="380" y2="195" stroke="#ffffff" stroke-width="8"/>
  <path d="M280 170 L280 220 M280 195 L320 170 M280 195 L320 220" stroke="url(#holo)" stroke-width="12" stroke-linecap="square"/>
  <text x="300" y="250" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="2">CHROMA ABSOLU</text>
  <text x="300" y="285" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#111111" text-anchor="middle">MASQUE VERT</text>
  <text x="300" y="300" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10" fill="#111111" text-anchor="middle">CHROMA NEUTRALISANT</text>
  <text x="300" y="320" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7.5" fill="#444444" text-anchor="middle">TARTARIC ACID + CENTELLA ASIATICA</text>
  <rect x="240" y="340" width="120" height="24" rx="2" fill="#667766"/>
  <text x="300" y="352" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="6.5" fill="#ffffff" text-anchor="middle">NEUTRALISANTS VERTS</text>
  <text x="300" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="6" fill="#ffffff" text-anchor="middle">GREEN NEUTRALIZERS</text>
  <text x="300" y="390" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#333333" text-anchor="middle">Masque sublimateur de brun foncé anti-reflets rouges</text>
  <text x="300" y="402" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#333333" text-anchor="middle">Dark brunette perfecting anti-red undertones masque</text>
  <text x="300" y="475" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#555555" text-anchor="middle">150 ml 5.1 fl.oz.</text>
</svg>
