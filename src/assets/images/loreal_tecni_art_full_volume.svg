<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>
    <linearGradient id="can" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#cccccc"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="530" rx="100" ry="20" fill="#000000" opacity="0.6"/>
  <!-- Tall Can -->
  <rect x="230" y="140" width="140" height="370" rx="8" fill="url(#can)"/>
  <rect x="245" y="80" width="110" height="65" rx="6" fill="url(#cap)" stroke="#444444" stroke-width="1"/>
  <!-- Tecni Art bold typography -->
  <text x="300" y="210" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="42" fill="#222222" text-anchor="middle" letter-spacing="-2">tec</text>
  <text x="300" y="250" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="42" fill="#222222" text-anchor="middle" letter-spacing="-2">ni</text>
  <text x="300" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="42" fill="#222222" text-anchor="middle" letter-spacing="-2">art</text>
  <text x="300" y="330" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#111111" text-anchor="middle">FULL VOLUME</text>
  <text x="300" y="350" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#111111" text-anchor="middle">EXTRA</text>
  <text x="300" y="375" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#555555" text-anchor="middle">Extra volume mousse</text>
  <text x="300" y="410" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10" fill="#d92b2b" text-anchor="middle" letter-spacing="1">FORCE 5</text>
  <text x="300" y="440" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10" fill="#111111" text-anchor="middle">L'ORÉAL</text>
  <text x="300" y="452" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#666666" text-anchor="middle">250 ml</text>
</svg>
