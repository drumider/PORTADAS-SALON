<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3d361c"/>
      <stop offset="100%" stop-color="#141208"/>
    </radialGradient>
    <linearGradient id="gold_oil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8cc"/>
      <stop offset="40%" stop-color="#ffe680"/>
      <stop offset="80%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ccac00"/>
    </linearGradient>
    <linearGradient id="silver_cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cccccc"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#999999"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="510" rx="90" ry="18" fill="#000000" opacity="0.6"/>
  <!-- Silver Pump Cap -->
  <rect x="270" y="80" width="60" height="35" rx="4" fill="url(#silver_cap)"/>
  <rect x="280" y="115" width="40" height="25" fill="#e8e8e8"/>
  <rect x="250" y="140" width="100" height="20" rx="4" fill="url(#silver_cap)"/>
  <!-- Faceted Glass Bottle -->
  <polygon points="230,160 370,160 390,460 210,460" fill="url(#gold_oil)" stroke="#ffffff" stroke-width="2"/>
  <line x1="280" y1="160" x2="270" y2="460" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <line x1="320" y1="160" x2="330" y2="460" stroke="#ffffff" stroke-width="1" opacity="0.5"/>
  <!-- Text Label -->
  <text x="300" y="240" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="16" fill="#111111" text-anchor="middle" letter-spacing="1">KÉRASTASE</text>
  <text x="300" y="252" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7" fill="#111111" text-anchor="middle" letter-spacing="2">PARIS</text>
  <text x="300" y="280" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" fill="#775500" text-anchor="middle" letter-spacing="1.5">BLOND ABSOLU</text>
  <text x="300" y="310" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#111111" text-anchor="middle">HUILE CICAEXTREME</text>
  <text x="300" y="335" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6.5" fill="#443300" text-anchor="middle">EDELWEISS OIL</text>
  <text x="300" y="370" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#222222" text-anchor="middle">Huile concentrée désoxydante e intense</text>
  <text x="300" y="382" font-family="'Helvetica Neue', Arial, sans-serif" font-size="6" fill="#222222" text-anchor="middle">Intense blonde strengthening oil concentrate</text>
  <text x="300" y="440" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#333333" text-anchor="middle">100 ml 3.38 fl.oz.</text>
</svg>
