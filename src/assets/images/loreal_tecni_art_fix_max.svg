<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111111"/>
    </radialGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0e0e0"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#cccccc"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="50%" stop-color="#333333"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="530" rx="120" ry="20" fill="#000000" opacity="0.6"/>
  <rect x="250" y="470" width="100" height="40" rx="4" fill="url(#cap)" stroke="#555555" stroke-width="1"/>
  <path d="M220 110 L380 110 L350 470 L250 470 Z" fill="url(#tube)"/>
  <rect x="215" y="100" width="170" height="15" fill="#bbbbbb" rx="1"/>
  <!-- Tecni Art bold graphic typography -->
  <text x="300" y="220" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52" fill="#222222" text-anchor="middle" letter-spacing="-2">tec</text>
  <text x="300" y="270" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52" fill="#222222" text-anchor="middle" letter-spacing="-2">ni</text>
  <text x="300" y="320" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="52" fill="#222222" text-anchor="middle" letter-spacing="-2">art</text>
  <text x="310" y="235" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="22" fill="#d92b2b">Fix</text>
  <text x="310" y="260" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="28" fill="#222222">Max</text>
  <text x="300" y="360" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="9" fill="#111111" text-anchor="middle">GEL PROFESSIONNEL</text>
  <text x="300" y="375" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#555555" text-anchor="middle">Extreme hold fixation</text>
  <text x="300" y="410" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="10" fill="#d92b2b" text-anchor="middle" letter-spacing="1">FORCE 6</text>
  <text x="300" y="430" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="11" fill="#222222" text-anchor="middle">tecni.art</text>
  <text x="300" y="450" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8" fill="#666666" text-anchor="middle">200 ml</text>
