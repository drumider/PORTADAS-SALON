<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a241b"/>
      <stop offset="100%" stop-color="#120e08"/>
    </radialGradient>
    <linearGradient id="amber_bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#cc8800"/>
      <stop offset="35%" stop-color="#ffcc33"/>
      <stop offset="65%" stop-color="#e69900"/>
      <stop offset="100%" stop-color="#995500"/>
    </linearGradient>
    <linearGradient id="gold_cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="30%" stop-color="#f9f1b5"/>
      <stop offset="60%" stop-color="#e6c65a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="530" rx="120" ry="22" fill="#000000" opacity="0.6"/>
  <!-- Bottle Shape -->
  <path d="M220 190 Q220 150 260 140 L260 100 L340 100 L340 140 Q380 150 380 190 L380 480 Q380 515 350 520 L250 520 Q220 515 220 480 Z" fill="url(#amber_bottle)"/>
  <!-- Shiny Gold Cap -->
  <rect x="250" y="60" width="100" height="42" rx="6" fill="url(#gold_cap)" stroke="#b8860b" stroke-width="1"/>
  <ellipse cx="300" cy="60" rx="50" ry="8" fill="#ffffff" opacity="0.8"/>
  <!-- Label Content -->
  <text x="300" y="210" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="1">KÉRASTASE</text>
  <text x="300" y="225" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="8" fill="#ffffff" text-anchor="middle" letter-spacing="2">PARIS</text>
  <!-- K Logo -->
  <path d="M280 250 L280 300 M280 275 L320 250 M280 275 L320 300" stroke="#ffffff" stroke-width="12" stroke-linecap="square"/>
  <text x="300" y="325" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle" letter-spacing="2">ELIXIR ULTIME</text>
  <text x="300" y="355" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="800" font-size="11" fill="#ffffff" text-anchor="middle">LE BAIN</text>
  <text x="300" y="372" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="600" font-size="7" fill="#fff0b3" text-anchor="middle">HUILE SACRÉE DE MARULA</text>
  <text x="300" y="392" font-family="'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="7.5" fill="#ffffff" text-anchor="middle">Shampooing à l'huile sublimatrice</text>
  <text x="300" y="405" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#fff8dc" text-anchor="middle">Cheveux ternes / Dull hair</text>
  <text x="300" y="417" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7" fill="#fff8dc" text-anchor="middle">Sublimating oil-infused shampoo</text>
  <text x="300" y="475" font-family="'Helvetica Neue', Arial, sans-serif" font-size="7.5" fill="#ffffff" opacity="0.9" text-anchor="middle">250 ml 8.5 fl.oz.</text>
</svg>
